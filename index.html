 if(st.view==='cat')drawChart('comb',cats,(i,k)=>{const x=pm?cs(META,i,k):0,y=pg?cs(GOOG,i,k):0;return{segs:[{v:x,fill:CV[k]},{v:y,fill:CV[k],hatch:true}],tip:row(`<i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:${CV[k]}"></i>${esc(k)}`,inr(x+y))+row('Meta',inr(x),1)+row('Google',inr(y),1)}});
 else drawChart('comb',['Meta','Google'].filter(p=>st.plats.has(p)),(i,p)=>{const src=p==='Meta'?META:GOOG,rr=src.filter(r=>r.m===i&&st.on.has(r.cat)),v=sum(rr,r=>r.spend);return{segs:[{v,fill:PC[p]}],tip:row(`<i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:${PC[p]}"></i>${p}`,inr(v))+row('Active campaigns',campN(rr),1)+row('Impressions',num(sum(rr,r=>r.imp)),1)}})}
// ---------- shell ----------
const card=(id,t,sub,extra)=>`<section class="card"><h2>${t}</h2><p class="sub"${id?` id="${id}"`:''}>${sub||''}</p>${extra||''}</section>`;
function chartCard(p,title){return `<section class="card"><h2>${title}</h2><p class="sub">INR. Click categories to include or exclude them; bars sit side by side within each month.</p><div id="${p}-ctl"></div>${p==='comb'?'<div class="note2" id="comb-note"></div>':''}<div class="chips" id="${p}-chips"></div><div class="selsum" id="${p}-sum"></div><div class="chartwrap" id="${p}-cw"><div class="chart" id="${p}-ch"><div class="tip" id="${p}-tip"></div></div></div></section>`}
$('panes').innerHTML=
 `<div class="pane" id="pane-meta"><div class="kpis" id="meta-kpis"></div><div class="grid">${chartCard('meta','Meta Ads: spend per category')}${card('','Spend by category × month','Selected months, INR.','<div id="meta-t1"></div>')}${card('meta-t2s','Cost per result by campaign','','<div class="ctl" style="margin-bottom:10px"><input id="meta-q" type="search" placeholder="Search campaign…"></div><div id="meta-t2"></div><p class="note">Result types differ between campaigns (leads, link clicks, profile visits, reach…), so compare cost per result within a result type, not across. “–” means no spend or no results in that month.</p>')}</div></div>`+
 `<div class="pane" id="pane-goog"><div class="kpis" id="goog-kpis"></div><div class="grid">${chartCard('goog','Google Ads: spend per category')}${card('','Spend by category × month','Selected months, INR.','<div id="goog-t1"></div>')}${card('','Campaigns','MS-CIT and KLiC first; other offerings are ordered by spend. Monthly columns show spend in INR.','<div class="ctl" style="margin-bottom:10px"><input id="goog-q" type="search" placeholder="Search campaign…"></div><div id="goog-t2"></div><p class="note">The Google export has impressions, interactions (clicks, video views and engagements) and spend, but no conversion or lead counts, so cost per interaction is shown instead of cost per result.</p>')}</div></div>`+
 `<div class="pane" id="pane-comb"><div class="kpis" id="comb-kpis"></div><div class="grid">${chartCard('comb','Meta + Google: spend per category')}${card('','Spend by month and platform','For the categories selected in the graph, INR.','<div id="comb-t1"></div>')}${card('','Spend by category and platform','Selected months, INR. Google share = Google ÷ (Meta + Google).','<div id="comb-t2"></div>')}</div></div>`;
$('meta-q').oninput=()=>renderMeta();$('goog-q').oninput=()=>renderGoog();
function render(){tabsUI();monthsUI();document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+tab));
 $('range').textContent=period()+' · Meta Ads and Google Ads';({meta:renderMeta,goog:renderGoog,comb:renderComb})[tab]()}
render();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});
</script></body></html>
